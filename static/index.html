<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194f42">
  <meta name="description" content="Relay 本地部署的信息中转站，汇集消息、整理重点、规划日程。">
  <title>Relay · 信息中转站</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
  <script defer src="/static/organizer.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#overview" class="brand"><span class="brand-symbol">r<span>↗</span></span><div>Relay<span class="brand-caption">你的信息，自有秩序</span></div></a>
    <button class="workspace" id="workspace"><span class="workspace-avatar">R</span><span><strong>个人工作区</strong><small id="workspace-mode">演示模式</small></span><span class="workspace-chevron">⌄</span></button>
    <div class="nav-label">工作空间</div>
    <nav id="nav" aria-label="主导航"></nav>
    <div class="sidebar-bottom">
      <div class="local-note"><span class="local-dot"></span><div><strong>本地优先，安心连接</strong><p>信息留在你的设备上</p></div></div>
      <button class="user-profile" id="account"><span class="user-avatar">我</span><span><strong>我的工作区</strong><small>Local workspace</small></span><span id="account-icon"></span></button>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb"><button id="mobile-menu" aria-label="切换导航">☰</button><span>工作空间</span><b>/</b><strong id="breadcrumb">总览</strong></div><div class="topbar-tools"><label class="search-box"><span id="search-icon"></span><input id="search" placeholder="搜索事项、课程或消息…" aria-label="搜索消息"><kbd>/</kbd></label><button class="icon-button" id="notifications" aria-label="提醒中心"></button><span class="top-avatar">我</span></div></header>
    <div class="mode-banner" id="mode-banner"></div>
    <main id="main" tabindex="-1"></main>
    <footer>RELAY <span>·</span> 把注意力，留给真正重要的事。<span class="footer-right">开源 · 本地部署 · v0.3.0</span></footer>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
